        $ref: '#/definitions/handler.rentalEstatePaginationMetaResponse'
    type: object
  handler.rentalEstatePaginationMetaResponse:
    properties:
      current_page:
        example: 1
        type: integer
      has_next:
        example: true
        type: boolean
      has_prev:
        example: false
        type: boolean
      limit:
        example: 10
        type: integer
      total_items:
        example: 100
        type: integer
      total_pages:
        example: 10
        type: integer
    type: object
  handler.rentalEstateResponse:
    properties:
      area_sqm:
        type: number
      bathrooms:
        type: integer
      bedrooms:
        type: integer
      created_at:
        type: string
      date_posted:
        type: string
      description:
        type: string
      formal_name:
        type: string
      id:
        type: string
      image_url:
        type: string
      latitude:
        type: number
      location:
        type: string
      longitude:
        type: number
      price:
        type: number
      property_type:
        type: string
      source_url:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  handler.triggerScraperRentalEstateRequest:
    properties:
      max_page:
        example: 1
        type: integer
      start_page:
        example: 1
        type: integer
      target_url:
        example: https://www.dotproperty.co.th/en/condos-for-rent/bangkok
        type: string
    required:
    - target_url
