        type: string
    required:
    - chatbot_id
    type: object
  dto.DeleteMultiTenantChatbotReqDTO:
    properties:
      id:
        example: 65f1a2b3c4d5e6f7a8b9c0d1
        type: string
    required:
    - id
    type: object
  dto.DeleteMultiTenantChatbotResDTO:
    properties:
      message:
        example: Chatbot deleted successfully
        type: string
      success:
        example: true
        type: boolean
    type: object
  dto.GetChatSessionResDTO:
    properties:
      session:
        $ref: '#/definitions/dto.ChatSessionResDTO'
    type: object
  dto.GetMultiTenantChatbotResDTO:
    properties:
      chatbot:
        $ref: '#/definitions/dto.ChatbotBlueprintResDTO'
    type: object
  dto.ListChatSessionsReqDTO:
    properties:
      chatbot_id:
        example: bot-888
        type: string
      page_size:
        example: 20
        maximum: 100
        minimum: 1
        type: integer
      page_token:
        example: 0
        minimum: 0
        type: integer
    type: object
  dto.ListChatSessionsResDTO:
    properties:
      sessions:
        items:
          $ref: '#/definitions/dto.ChatSessionResDTO'
        type: array
      total_count:
        example: 5
        type: integer
    type: object
  dto.ListKnowledgeFilesReqDTO:
    properties:
      chatbot_id:
        type: string
      limit:
        default: 10
        type: integer
      offset:
        default: 0
        type: integer
    required:
    - chatbot_id
    type: object
  dto.ListMultiTenantChatbotsReqDTO:
    properties:
      page_size:
        example: 10
        maximum: 100
        minimum: 1
        type: integer
      page_token:
        example: 0
        minimum: 0
