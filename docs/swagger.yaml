    type: object
  dto.ListMultiTenantChatbotsResDTO:
    properties:
      chatbots:
        items:
          $ref: '#/definitions/dto.ChatbotBlueprintResDTO'
        type: array
      next_page_token:
        example: 10
        type: integer
      total_count:
        example: 25
        type: integer
    type: object
  dto.MetadataVectorRecordDTO:
    properties:
      chatbot_id:
        example: bot-888
        type: string
      chunk_index:
        example: 1
        type: integer
      file_id:
        example: file-123
        type: string
      filename:
        example: document.pdf
        type: string
      page_number:
        example: 5
        type: integer
      text_content:
        example: เนื้อหาในเอกสารที่ค้นพบ...
        type: string
      user_id:
        example: user-999
        type: string
    type: object
  dto.SearchSimilarReqDTO:
    properties:
      chatbot_id:
        example: bot-888
        type: string
      knowledge_file_id:
        example: file-123
        type: string
      query_text:
        example: สอบถามข้อมูลโปรโมชั่น
        type: string
      top_k:
        example: 5
        type: integer
    required:
    - chatbot_id
    - query_text
