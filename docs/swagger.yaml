  handler.userResponse:
    properties:
      name:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API Service สำหรับจัดการข้อมูล Scraping และแสดงผลบน Dashboard
  title: Scraper & Data Aggregator API
  version: "1.0"
paths:
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Logout user session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.apiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: User Logout
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login with username, password
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.loginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Loging into system
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Receive refresh_token from cookie to refreshing refreshToken in
        data
      parameters:
      - description: 'Cookie: refresh_token=...'
        in: header
        name: refresh_token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Access Token succesfully
          headers:
            Set-Cookie:
              description: refresh_token=...; Path=/; HttpOnly; Secure; SameSite=Strict
              type: string
          schema:
            $ref: '#/definitions/handler.refreshResponse'
        "400":
          description: Bad input request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "401":
          description: Cookie missing or Token Invalid
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - CookieAuth: []
      summary: Refresh all token of user
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with username, password, and name
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.registerResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - Auth
  /chat-sessions/{id}:
    get:
      consumes:
      - application/json
      description: Get specific chat session details and message history
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GetChatSessionResDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Get Chat Session by ID
      tags:
      - Chat Session
  /chat-sessions/create:
    post:
      consumes:
      - application/json
      description: Create a new chat session for a specific chatbot
      parameters:
      - description: Create Chat Session Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateChatSessionReqDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CreateChatSessionResDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Create Chat Session
      tags:
      - Chat Session
  /chat-sessions/delete:
    delete:
      consumes:
      - application/json
      description: Delete a chat session by ID
      parameters:
      - description: Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DeleteChatSessionReqDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Delete Chat Session
      tags:
      - Chat Session
  /chat-sessions/list:
    post:
      consumes:
      - application/json
      description: Get a paginated list of chat sessions for a user or chatbot
      parameters:
      - description: Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ListChatSessionsReqDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListChatSessionsResDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: List Chat Sessions
      tags:
      - Chat Session
  /chat-sessions/messages:
    post:
      consumes:
      - application/json
      description: Add a new chat message to an existing session
      parameters:
      - description: Add Chat Message Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AddChatMessageReqDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AddChatMessageResDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Add Chat Message
      tags:
      - Chat Session
  /chatbots/{id}:
    get:
      consumes:
      - application/json
      description: Get specific chatbot blueprint details by its ID and User ID
      parameters:
      - description: Chatbot ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GetMultiTenantChatbotResDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Get Multi-Tenant Chatbot by ID
      tags:
      - Chatbot
  /chatbots/create:
    post:
      consumes:
      - application/json
      description: Create a new chatbot blueprint for a specific user/tenant
      parameters:
      - description: Create Chatbot Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateMultiTenantChatbotReqDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CreateMultiTenantChatbotResDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Create Multi-Tenant Chatbot
      tags:
      - Chatbot
  /chatbots/delete:
    delete:
      consumes:
      - application/json
      description: Delete a chatbot blueprint by ID and User ID
      parameters:
      - description: Update Chatbot Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DeleteMultiTenantChatbotReqDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DeleteMultiTenantChatbotResDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Delete Multi-Tenant Chatbot
      tags:
      - Chatbot
  /chatbots/list:
    post:
      consumes:
      - application/json
      description: Get a paginated list of chatbot blueprints for a specific user
      parameters:
      - description: Create Chat Session Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ListMultiTenantChatbotsReqDTO'
      produces:
      - application/json
      responses:
        "200":
