basePath: /api/v1
definitions:
  domain.RentalEstate:
    properties:
      area_sqm:
        type: number
      bathrooms:
        type: integer
      bedrooms:
        type: integer
      created_at:
        type: string
      date_posted:
        type: string
      description:
        type: string
      formal_name:
        type: string
      id:
        type: string
      image_url:
        type: string
      latitude:
        type: number
      location:
        type: string
      longitude:
        type: number
      price:
        type: number
      property_type:
        type: string
      source_url:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  domain_ai_estate_rag.Chunk:
    properties:
      chunk_index:
        type: integer
      page_number:
        type: integer
      text_content:
        type: string
      token_count:
        type: integer
      vector_id:
        type: string
    type: object
  domain_ai_estate_rag.DeleteKnowledgeFileResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  domain_ai_estate_rag.FileStatus:
    enum:
    - 0
    - 1
    - 2
    format: int32
    type: integer
    x-enum-varnames:
    - FileStatusPending
    - FileStatusCompleted
    - FileStatusFailed
  domain_ai_estate_rag.GetKnowledgeFileResponse:
    properties:
      file:
        $ref: '#/definitions/domain_ai_estate_rag.KnowledgeFile'
    type: object
  domain_ai_estate_rag.KnowledgeFile:
    properties:
      chatbot_id:
        type: string
      chunks:
        items:
          $ref: '#/definitions/domain_ai_estate_rag.Chunk'
        type: array
      created_at:
        type: string
      error_message:
        description: optional
        type: string
      file_size_bytes:
        type: integer
      file_type:
        type: string
      filename:
        type: string
      id:
        type: string
      status:
        $ref: '#/definitions/domain_ai_estate_rag.FileStatus'
      text_content:
        description: optional
        type: string
      total_chunks:
        type: integer
      total_page:
        type: integer
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  domain_ai_estate_rag.ListKnowledgeFilesResponse:
    properties:
      files:
        items:
          $ref: '#/definitions/domain_ai_estate_rag.KnowledgeFile'
        type: array
      total_count:
        type: integer
    type: object
  domain_ai_estate_rag.UploadFileMultiTenantResponse:
    properties:
      created_at:
        type: string
      file_id:
        type: string
      message:
        type: string
      status:
        $ref: '#/definitions/domain_ai_estate_rag.FileStatus'
      total_bytes:
        type: integer
      total_chunks:
        type: integer
    type: object
  dto.AddChatMessageReqDTO:
    properties:
      content:
        example: สวัสดีครับ มีโปรโมชั่นคอนโดอะไรบ้าง
        type: string
      role:
        example: USER
        type: string
      session_id:
        example: 65f1a2b3c4d5e6f7a8b9c0d1
        type: string
    required:
    - content
    - role
    - session_id
    type: object
  dto.AddChatMessageResDTO:
    properties:
      message:
        $ref: '#/definitions/dto.ChatMessageResDTO'
    type: object
  dto.ChatMessageResDTO:
    properties:
      content:
        example: สวัสดีครับ มีโปรโมชั่นคอนโดอะไรบ้าง
        type: string
      created_at:
        example: "2026-08-18T10:00:00Z"
        type: string
      role:
        example: USER
        type: string
    type: object
  dto.ChatSessionResDTO:
    properties:
      chatbot_id:
        example: bot-888
        type: string
      created_at:
        example: "2026-08-18T10:00:00Z"
        type: string
      id:
        example: 65f1a2b3c4d5e6f7a8b9c0d1
        type: string
      messages:
        items:
          $ref: '#/definitions/dto.ChatMessageResDTO'
        type: array
      session_title:
        example: สอบถามข้อมูลโปรโมชั่น
        type: string
      updated_at:
        example: "2026-08-18T10:05:00Z"
        type: string
      user_id:
        example: user-999
        type: string
    type: object
  dto.ChatbotBlueprintResDTO:
    properties:
      created_at:
        example: "2026-08-18T10:00:00Z"
        type: string
      description:
        example: บอทสำหรับตอบคำถามและดูแลลูกค้า
        type: string
      id:
        example: 65f1a2b3c4d5e6f7a8b9c0d1
        type: string
      name:
        example: Customer Support Bot
        type: string
      system_prompt:
        example: You are a helpful assistant.
        type: string
      updated_at:
        example: "2026-08-18T10:05:00Z"
        type: string
      user_id:
        example: user-999
        type: string
    type: object
  dto.CreateChatSessionReqDTO:
    properties:
      chatbot_id:
        example: bot-888
        type: string
      session_title:
        example: สอบถามข้อมูลโปรโมชั่น
        type: string
    required:
    - chatbot_id
    type: object
  dto.CreateChatSessionResDTO:
    properties:
      session:
        $ref: '#/definitions/dto.ChatSessionResDTO'
    type: object
  dto.CreateMultiTenantChatbotReqDTO:
    properties:
      description:
        example: บอทสำหรับตอบคำถามและดูแลลูกค้า
        type: string
      name:
        example: Customer Support Bot
        type: string
      system_prompt:
        example: You are a helpful assistant.
        type: string
    required:
    - name
    - system_prompt
    type: object
  dto.CreateMultiTenantChatbotResDTO:
    properties:
      chatbot:
        $ref: '#/definitions/dto.ChatbotBlueprintResDTO'
    type: object
  dto.DeleteChatSessionReqDTO:
    properties:
      id:
        example: 65f1a2b3c4d5e6f7a8b9c0d1
