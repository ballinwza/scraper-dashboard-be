  dto.SearchVectorRecordItemDTO:
    properties:
      record:
        $ref: '#/definitions/dto.VectorRecordDTO'
      score:
        example: 0.895
        type: number
    type: object
  dto.UpdateMultiTenantChatbotReqDTO:
    properties:
      description:
        example: Updated description
        type: string
      id:
        example: 65f1a2b3c4d5e6f7a8b9c0d1
        type: string
      name:
        example: Updated Bot Name
        type: string
      system_prompt:
        example: Updated system prompt
        type: string
    required:
    - id
    type: object
  dto.UpdateMultiTenantChatbotResDTO:
    properties:
      chatbot:
        $ref: '#/definitions/dto.ChatbotBlueprintResDTO'
    type: object
  dto.UploadFileMultiTenantReqDTO:
    properties:
      chatbot_id:
        type: string
    required:
    - chatbot_id
    type: object
  dto.VectorRecordDTO:
    properties:
      id:
        example: vector-uuid-123
        type: string
      metadata:
        $ref: '#/definitions/dto.MetadataVectorRecordDTO'
      values:
        items:
          type: number
        type: array
    type: object
  handler.apiResponse:
    properties:
      data: {}
      message:
        example: Operation successful
        type: string
      status:
        example: 200
        type: integer
    type: object
  handler.errorResponse:
    properties:
      error:
        example: Invalid request payload
        type: string
    type: object
  handler.generateAnswerRequest:
    properties:
      question:
        default: สรุปเอกสารย่อๆ
        type: string
    required:
    - question
    type: object
  handler.generateAnswerResponse:
    properties:
      message:
        type: string
    type: object
  handler.loginRequest:
    properties:
      password:
        minLength: 6
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handler.loginResponse:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
    type: object
  handler.refreshResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refresh_token:
        example: d3f78a9c2b4e8f110a1290bc5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f
        type: string
    type: object
  handler.registerRequest:
    properties:
      name:
        type: string
      password:
        minLength: 6
        type: string
      username:
        type: string
    required:
    - name
    - password
    - username
    type: object
  handler.registerResponse:
    properties:
      id:
        type: string
      message:
        type: string
      name:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  handler.rentalEstatePaginatedResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.RentalEstate'
        type: array
